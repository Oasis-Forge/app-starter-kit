name: CI

# The kit ships YAML, shell and PowerShell that nothing executes until it lands in
# a new app, so every bug in it was found by an app paying for it. This runs the
# kit's own tests instead. No path filters, so required status checks never hang.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell tests and shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck
        run: |
          shopt -s nullglob
          files=(template/scripts/*.sh stacks/*/files/tool/*.sh tests/*.sh)
          printf 'checking %s\n' "${files[@]}"
          shellcheck --severity=warning "${files[@]}"

      # tests/test-*.sh each exit non-zero on the first failed check.
      - name: Run the shell tests
        run: |
          shopt -s nullglob
          status=0
          for t in tests/test-*.sh; do
            echo "::group::$t"
            bash "$t" || status=1
            echo "::endgroup::"
          done
          exit $status

  powershell:
    name: PowerShell tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # A parse error in new-app.ps1 only shows up when someone starts an app.
      - name: Parse every script
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $bad++
              Write-Output "::error file=$($_.FullName)::$($errors[0].Message)"
            }
          }
          if ($bad) { exit 1 }
          Write-Output 'Every .ps1 parses.'

      # Windows PowerShell 5.1, not pwsh: that is what the kit is run with, and the
      # two differ enough to matter (no &&, no ternary, different default encodings).
      - name: Run the PowerShell tests
        shell: powershell
        run: |
          $status = 0
          Get-ChildItem tests -Filter 'test-*.ps1' | ForEach-Object {
            Write-Output "::group::$($_.Name)"
            & $_.FullName
            if ($LASTEXITCODE -ne 0) { $status = 1 }
            Write-Output '::endgroup::'
          }
          exit $status

  workflows:
    name: Template workflows are valid YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # The template's workflows are never run from this repo, so a YAML error in
      # one is invisible until an app's first PR fails to start at all.
      - name: Parse every workflow
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for path in sorted(glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True)):
              try:
                  with open(path, encoding='utf-8') as f:
                      yaml.safe_load(f)
                  print(f'  ok    {path}')
              except yaml.YAMLError as e:
                  bad += 1
                  print(f'::error file={path}::{e}')
          sys.exit(1 if bad else 0)
          PY
