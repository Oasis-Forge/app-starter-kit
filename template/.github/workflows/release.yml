name: Release

# Every merge to main runs this. Most merges are not releases: a release is the
# maintainer's call, and a PR that leaves the version alone is the normal case.
# Either way the merge runs the same checks; only the summary says whether the
# version moved. A stack overlay replaces this file with one that also builds,
# as a check.
#
# It publishes nothing: no GitHub Release, no artifact, no store upload. A CI
# build is unsigned or debug-signed unless the optional signing secrets are set,
# so anything downloadable from here is a build nobody can install over an
# existing copy and nobody can upload to a store — while looking exactly like the
# one that shipped. One machine produces the real artifact (docs/RELEASING.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Two commits: on main, whether this merge is a release is read by comparing
      # its version with the commit before it (scripts/version.sh released).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Read the version
        id: version
        run: |
          name=$(bash scripts/version.sh name)
          release=false
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            # CI compares each PR against main's version, so a merge can leave it
            # unchanged: a Dependabot PR, which the gate exempts, or a PR merged
            # behind another that took the same version. Nothing on main can be
            # fixed by a red build, so that is reported rather than refused.
            release=$(bash scripts/version.sh released)
          else
            echo "Not on main: building $name as a check only." >> "$GITHUB_STEP_SUMMARY"
          fi
          { echo "name=$name"; echo "release=$release"; } >> "$GITHUB_OUTPUT"

      # A stack overlay builds the release artifacts here, as a check that the
      # release build compiles on a clean machine and to run whatever gates the
      # stack has. Nothing is uploaded, attached or tagged: the artifact that
      # reaches a store is built locally (docs/RELEASING.md).

      - name: Say where the uploadable artifact comes from
        if: steps.version.outputs.release == 'true'
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          {
            echo "### $NAME builds"
            echo
            echo "Nothing is published from CI and no tag is pushed."
            echo "Build the artifact locally and upload it by hand — see docs/RELEASING.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Say that this merge is not a release
        if: steps.version.outputs.release != 'true' && github.ref == 'refs/heads/main'
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          {
            echo "### Not a release: main is still on $NAME"
            echo
            echo "This merge left the version alone: a dependency bump, or a PR merged behind another."
            echo "It was checked all the same. Its changes go out with the next version."
          } >> "$GITHUB_STEP_SUMMARY"
