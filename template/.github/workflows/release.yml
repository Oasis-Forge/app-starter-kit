name: Release

# Every merge to main whose version has no vX.Y.Z tag yet tags the merge commit
# and drafts a GitHub Release with the CHANGELOG.md entry as notes. CI makes every
# PR bump the version, so every merged PR is a release. A stack overlay replaces
# this file with one that also builds and attaches the artifacts.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag and draft the release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: |
          name=$(bash scripts/version.sh name)
          tag="v$name"
          release=false
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Not on main: $tag is not released." >> "$GITHUB_STEP_SUMMARY"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released: nothing to release." >> "$GITHUB_STEP_SUMMARY"
          else
            release=true
          fi
          { echo "name=$name"; echo "tag=$tag"; echo "release=$release"; } >> "$GITHUB_OUTPUT"

      # Build the release artifacts into dist/ here, named after the version.

      - name: Write release notes
        if: steps.version.outputs.release == 'true'
        run: bash scripts/version.sh notes > release-notes.md

      # CI's version check compares PRs against this tag. A draft release doesn't
      # create its tag, so push it first.
      - name: Tag the release
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      # Draft: on a public repo the artifacts stay private until you publish.
      - name: Draft the GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: '{{APP_NAME}} ${{ steps.version.outputs.name }}'
          body_path: release-notes.md
          files: dist/*
          draft: true
