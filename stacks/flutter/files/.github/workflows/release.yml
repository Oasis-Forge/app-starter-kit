name: Release

# Every merge to main whose pubspec.yaml version (x.y.z+N) has no vX.Y.Z tag yet
# builds the APK and AAB, checks the release manifest's permissions, and tags the
# merge commit. CI makes every PR bump the version, so every merged PR gets a tag.
#
# It publishes nothing: no GitHub Release, no artifact, no Play upload. The build
# here is a check, not a deliverable. What reaches Play is built locally, signed
# from android/key.properties and uploaded by hand (docs/RELEASING.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '{{FLUTTER_VERSION}}'
  PACKAGE_NAME: '{{APP_ID}}'
  SLUG: '{{SLUG}}'

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.read.outputs.name }}
      tag: ${{ steps.read.outputs.tag }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the pubspec.yaml version
        id: read
        run: |
          name=$(bash scripts/version.sh name)
          tag="v$name"
          release=false
          # Without --exit-code this is empty and exit 0 when the tag does not exist,
          # so the pipe's status cannot mask the lookup's.
          tagged=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Not on main: building $tag without releasing it." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$tagged" ]; then
            # CI compares each PR against the newest tag, so two PRs opened together
            # can both pass with the same version. The first merge tags it; the second
            # then had nothing to release and said so in the summary, leaving main's
            # code unreleased and the published artifact older than its own changelog.
            # Silently doing nothing is the one outcome worth refusing.
            if [ "$tagged" = "$GITHUB_SHA" ]; then
              echo "$tag is already released from this commit: nothing to do." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$tag already points at ${tagged:0:7}, but main is now $GITHUB_SHA. This commit would ship as part of no release. Raise the version on a branch off main and merge it, so these changes get a release of their own."
              exit 1
            fi
          else
            release=true
          fi
          { echo "name=$name"; echo "tag=$tag"; echo "release=$release"; } >> "$GITHUB_OUTPUT"

  build:
    name: Build and tag
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAME: ${{ needs.version.outputs.name }}
      TAG: ${{ needs.version.outputs.tag }}
      RELEASE: ${{ needs.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # A variable, not a secret: GitHub masks a secret's value everywhere it
          # appears in a log, and an alias like "upload" would turn every mention of
          # upload-keystore.jks into ***-keystore.jks.
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: signing with a throwaway debug key and skipping Play."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Build app bundle and APK
        run: |
          flutter build appbundle --release
          flutter build apk --release

      # Having the secrets does not mean the build used them: the signing config has
      # to be wired into android/app/build.gradle.kts as well (docs/STACK_NOTES.md →
      # Scaffold). Without it the AAB is debug-signed, Play rejects it for not
      # matching the upload certificate, and the warning below is suppressed because
      # the job believed it was signed. Ask the artifact, not the secret.
      - name: Prove the bundle is really signed
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          certs=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab)
          echo "$certs"
          if printf '%s' "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::The signing secrets are set but the bundle is debug-signed: android/app/build.gradle.kts is not reading android/key.properties (docs/STACK_NOTES.md → Scaffold)."
            exit 1
          fi

      # RUN-2: the store listing's data-safety answers depend on the permissions, so
      # a plugin adding one silently has to fail the release. Checked both ways: a
      # permission the app needs and lost is as much a bug as one it gained.
      - name: Check the APK's permissions
        env:
          ALLOWED: ''
        run: |
          # The default step shell is `bash -e` with no pipefail, so the previous
          # `aapt2 ... | tee permissions.txt` reported tee's exit code: a failed dump
          # left the file empty and the gate passed with nothing in it. The comparison
          # itself now lives in tool/check_permissions.sh, where it is shellchecked
          # and covered by tests/test-permission-gate.sh.
          set -euo pipefail
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          "$aapt2" dump permissions build/app/outputs/flutter-apk/app-release.apk > permissions.txt
          cat permissions.txt
          bash tool/check_permissions.sh permissions.txt

      - name: Name the files after the version
        id: files
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$SLUG-$NAME.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/$SLUG-$NAME.aab"
          # Play symbolicates crashes with this. It is built on every release build
          # and was thrown away with the runner, so every stack trace in Play Console
          # stayed obfuscated. It never goes near the public release: it is an input
          # to Play and to the retained build artifact only.
          mapping=""
          if [ -f build/app/outputs/mapping/release/mapping.txt ]; then
            mapping="dist/$SLUG-$NAME-mapping.txt"
            cp build/app/outputs/mapping/release/mapping.txt "$mapping"
          else
            echo "No mapping.txt: this build is not minified, so Play needs no deobfuscation file." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "mapping=$mapping" >> "$GITHUB_OUTPUT"


      # This workflow publishes nothing. It exists to prove the release build
      # compiles on a clean machine and to hold the permission gate above, then
      # to tag the version. The bundle that reaches Play is built locally,
      # signed from android/key.properties, and uploaded by hand
      # (docs/RELEASING.md). Nothing downloadable is produced here, so nobody
      # can mistake a CI build — debug-signed unless the optional keystore
      # secrets are set — for the one that shipped.

      # The tag records the release; CI's version check compares PRs against it.
      - name: Tag the release
        if: env.RELEASE == 'true'
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Say where the uploadable artifact comes from
        if: env.RELEASE == 'true'
        run: |
          {
            echo "### $TAG tagged"
            echo
            echo "No artifact is published from CI. Build it locally and upload it by hand:"
            echo
            echo '    flutter build appbundle --release'
            echo
            echo "See docs/RELEASING.md."
          } >> "$GITHUB_STEP_SUMMARY"
