name: Release

# Every merge to main whose version has no vX.Y.Z tag yet tags the merge commit.
# CI makes every PR bump the version, so every merged PR is a release. A stack
# overlay replaces this file with one that also builds, as a check.
#
# It publishes nothing: no GitHub Release, no artifact, no store upload. A CI
# build is unsigned or debug-signed unless the optional signing secrets are set,
# so anything downloadable from here is a build nobody can install over an
# existing copy and nobody can upload to a store — while looking exactly like the
# one that shipped. One machine produces the real artifact (docs/RELEASING.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag the release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: |
          name=$(bash scripts/version.sh name)
          tag="v$name"
          release=false
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Not on main: $tag is not released." >> "$GITHUB_STEP_SUMMARY"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released: nothing to release." >> "$GITHUB_STEP_SUMMARY"
          else
            release=true
          fi
          { echo "name=$name"; echo "tag=$tag"; echo "release=$release"; } >> "$GITHUB_OUTPUT"

      # A stack overlay builds the release artifacts here, as a check that the
      # release build compiles on a clean machine and to run whatever gates the
      # stack has. Nothing is uploaded or attached: the artifact that reaches a
      # store is built locally (docs/RELEASING.md).

      # CI's version check compares PRs against this tag.
      - name: Tag the release
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
