name: CI

# No path filters, so required status checks never hang.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Set up the toolchain, then: install, format check, analyze, test with coverage.
      # A stack overlay (stacks/<stack>/files) replaces this whole file.
      - name: Stack checks
        run: |
          echo "::error::Fill in the stack's checks in .github/workflows/ci.yml."
          exit 1

      # GitHub Pages publishes every file in docs/, on the domain the store listing
      # points at. This fails when a doc is neither excluded nor declared public.
      - name: Check what GitHub Pages would publish
        if: ${{ !cancelled() }}
        run: bash scripts/check_public_docs.sh

      # The rule IDs are the spine of the method and nothing else checks them. An
      # ID cited but defined nowhere is a typo or a renumbering, and fails; a rule
      # nothing cites is reported in the summary without failing, because it may
      # simply not be built yet.
      - name: Check the product rules
        if: ${{ !cancelled() }}
        run: bash scripts/rules.sh

      # A PR does not have to be a release: the version may stand still, and this
      # passes when it does. When a branch does raise it, it must be above main's
      # and carry its CHANGELOG.md entry.
      - name: Check the version, if this branch raises one
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: bash scripts/version.sh check
